name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify packaged styles
        run: node scripts/test-packaged-styles.mjs

      - name: Audit bundle sizes
        run: node scripts/audit-sizes.mjs

      - name: Validate manifests
        run: pnpm validate:manifests

      - name: Manifest gap report
        run: pnpm report:manifests

      - name: Upload manifest gap report
        uses: actions/upload-artifact@v4
        with:
          name: manifest-gaps
          path: reports/
          if-no-files-found: error

      - name: Generate registry payload
        run: pnpm generate:registry

      - name: Generate LLM docs (llms.txt + /llm routes)
        run: pnpm generate:llm-docs

      - name: Check generated files are committed
        run: git diff --exit-code -- README.md apps/docs/lib/component-count.ts apps/docs/public/llms.txt apps/docs/public/llm apps/docs/public/registry

      - name: Check LLM documentation surfaces
        run: pnpm check:llm

      - name: Check component coverage
        run: pnpm check:components

      - name: Verify Tailwind v4 theme compiles
        run: pnpm verify:tailwind-v4

      - name: Verify Tailwind 3 preset compiles
        run: pnpm verify:tailwind3

      - name: Verify per-file modules and subpath exports
        run: pnpm verify:modules

      - name: Verify registry cache reload
        run: pnpm verify:registry

      - name: Verify prebuilt stylesheet reset
        run: pnpm verify:prebuilt
