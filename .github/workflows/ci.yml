name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency audit (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact -v

  dependency-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Verify sensitive-file deny rules
        run: |
          for f in .env .env.local .env.production.pem certs/server.pem apps/app/.env apps/app/keys/service.pem; do
            git check-ignore -q "$f" || { echo "not gitignored: $f"; exit 1; }
          done

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Baselines were generated on Windows; regenerate them on the runner image
      # with `pnpm test:visual:update` before making this blocking.
      - name: Visual regression
        continue-on-error: true
        run: pnpm test:visual

      - name: Start docs server
        run: |
          pnpm --filter slipstream-ui-docs exec next start -p 3114 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3114 >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "docs server did not start" >&2
          exit 1

      - name: E2E journeys
        run: pnpm test:e2e

      - name: Docs route smoke test
        run: pnpm --filter slipstream-ui-docs exec tsx scripts/smoke-routes.ts http://localhost:3114

      - name: Accessibility audit
        run: pnpm --filter slipstream-ui-docs exec tsx scripts/audit-a11y.ts http://localhost:3114

      - name: Verify packaged styles
        run: node scripts/test-packaged-styles.mjs

      - name: Audit bundle sizes
        run: node scripts/audit-sizes.mjs

      - name: Validate manifests
        run: pnpm validate:manifests

      - name: Manifest gap report
        run: pnpm report:manifests

      - name: Upload manifest gap report
        uses: actions/upload-artifact@v7
        with:
          name: manifest-gaps
          path: reports/
          if-no-files-found: error

      - name: Generate registry payload
        run: pnpm generate:registry

      - name: Generate LLM docs (llms.txt + /llm routes)
        run: pnpm generate:llm-docs

      - name: Generate article + a11y-scorecard snapshots
        run: pnpm generate:article-content && pnpm generate:a11y-scorecard

      - name: Check generated files are committed
        run: git diff --exit-code -- README.md llms.txt release.json apps/docs/lib/component-count.ts apps/docs/public/llms.txt apps/docs/public/llms-full.txt apps/docs/public/llm apps/docs/public/registry apps/docs/lib/article-content.generated.ts apps/docs/lib/a11y-scorecard.generated.ts

      - name: Check LLM documentation surfaces
        run: pnpm check:llm

      - name: Check component coverage
        run: pnpm check:components

      - name: Verify Tailwind v4 theme compiles
        run: pnpm verify:tailwind-v4

      - name: Verify Tailwind 3 preset compiles
        run: pnpm verify:tailwind3

      - name: Verify per-file modules and subpath exports
        run: pnpm verify:modules

      - name: Verify registry cache reload
        run: pnpm verify:registry

      - name: Verify prebuilt stylesheet reset
        run: pnpm verify:prebuilt

      - name: Consumer smoke build (Next 16 + Tailwind 3)
        run: pnpm verify:consumer
