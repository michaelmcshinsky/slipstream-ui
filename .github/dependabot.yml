version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Tailwind v4 rewrites the config/token layer and utility names; the
      # library targets v3 until a dedicated migration lands with a visual
      # regression pass. See the closed "Bump tailwindcss 3.4 -> 4.x" PR.
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      # Prisma 7 drops datasource url from schema.prisma and requires
      # prisma.config.ts + driver adapters; needs a dedicated migration.
      - dependency-name: "prisma"
        versions: [">=7.0.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
