<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Slipstream UI Playground</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      // Updates <meta name="color-scheme"> to sync with localStorage override.
      try {
        var stored = localStorage.getItem('slipstream-theme');
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          meta.content = 'dark';
        } else if (stored === 'light') {
          meta.content = 'light';
        }
      } catch {}
      // Mirror of parseStoredConsent in src/lib/analytics.ts: only a fresh
      // timestamped JSON choice counts as decided (180 days). Repeat visitors
      // never see the cookie banner flash.
      try {
        var consentRaw = localStorage.getItem('slipstream-consent');
        var consentDecided = false;
        if (consentRaw) {
          var consent = JSON.parse(consentRaw);
          consentDecided =
            (consent.v === 'granted' || consent.v === 'denied') &&
            typeof consent.at === 'number' &&
            (Date.now() - consent.at) < 15552000000;
        }
        if (consentDecided) {
          document.documentElement.classList.add('consent-decided');
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
